<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topdown Sandbox</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-bottom: 1.5rem;
        }
        canvas {
            outline: 1px solid black;
        }
        p {
            margin: 1.5rem;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        #world-manager {
            display: flex;
            gap: 10px;
        }
        #world-download, #world-load {
            padding: 10px;
        }
        #world-download > legend, #world-load > legend {
            padding-left: 5px;
            padding-right: 5px;
        }
        #world-button {
            padding: 2.5px;
        }
    </style>
</head>
<body>
    <h1 id="page-title">Topdown Sandbox</h1>
    <canvas id="tdsandbox"></canvas>
    <p id="page-description"></p>
    <p>Press Z to place and X to erase</p>
    <div id="world-manager">
        <fieldset id="world-download">
            <legend>Baixar mundo</legend>
            <input type="text" name="MUNDO-filename" id="world-filename" placeholder="nome-do-arquivo.json">
            <button id="world-download">BAIXAR MUNDO</button>
        </fieldset>
        <fieldset id="world-load">
            <legend>Carregar mundo</legend>
            <input type="file" name="world-load" id="world-load">
        </fieldset>
    </div>
    <script type="module" src="js/game.js"></script>
    <script type="module" src="js/world-manager.js"></script>
</body>
</html>
